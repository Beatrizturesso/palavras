<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criptografia por substituição</title>
</head>
<body>
  <main>
    <h1>Criptografia por substituição</h1>
    <p>
      Digite uma senha usando letras minúsculas de <code>a</code> a <code>z</code>.
      O programa substituirá cada letra conforme a ordem do dicionário.
    </p>

    <label for="senha">Senha:</label>
    <input id="senha" type="text" placeholder="Ex.: marcelo">

    <button id="criptografar">Criptografar</button>

    <p id="resultado" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
